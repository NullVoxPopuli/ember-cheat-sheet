title: Yok edilme anında bir şey yap
description: >
  Değiştirici fonksiyon (modifier) bir fonksiyon döndürebilir.
  Bu fonksiyon, Ember öğeyi DOM'dan kaldırdıktan sonra ve değiştirici fonksiyon yeniden çalışmadan önce çalışır.
  Değiştirici fonksiyonun yaptığını geri almak için onu kullanın.

destructor: >
  Bir öğeye ait olmayan işler için <code>registerDestructor</code> kullanın.
  Destructor, Ember bileşeni yok ettiğinde çalışır ve temizlik kodunu kurulum kodunun yanında tutar.
  <code>willDestroy</code> hook'u da aynı işi görür.
