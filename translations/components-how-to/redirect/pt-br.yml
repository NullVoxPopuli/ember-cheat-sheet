title: Redirecionar para outra URL
description: >
  Injete o serviço de roteamento (router service) e chame <code>transitionTo</code> com o nome de uma rota ou uma URL.
  O <code>replaceWith</code> faz o mesmo, mas substitui a entrada atual no histórico do navegador.

link: >
  Quando é o usuário quem inicia a navegação, renderize um link com <code>&lt;LinkTo&gt;</code>.
