title: 値であるコンポーネントをレンダリングする
description: >
  コンポーネントである値はどれも、山括弧で呼び出せます。たとえば<code>&lt;this.Kind /&gt;</code>、<code>&lt;@Kind /&gt;</code>、ブロックパラメーターなどです。属性とモディファイアは、ほかのコンポーネントの場合と同じように働き、<code>...attributes</code>を持つ要素に適用されます。

curly: >
  波括弧による呼び出しでは、属性やモディファイアを指定できません。<code>component</code>ヘルパーを値として使って引数をあらかじめ設定し、その結果を山括弧で呼び出してください。
