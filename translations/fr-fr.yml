layout:
  application:
    title: Aide-mémoire Ember.js
    shortTitle: Aide-mémoire
    logo-alt-text: 'Le logo Ember à côté des mots « Cheat Sheet » (en anglais)'
    description-1: >
      Ce guide est un aide-mémoire (« cheat sheet » en anglais) pour '<a href="https://emberjs.com/" target="_blank" rel="noopener noreferrer">Ember.js</a>'.
      Les exemples sont écrits pour Ember 7.3 et utilisent la balise '<code>&lt;template&gt;</code>'.
      Il n’est pas exhaustif mais devrait permettre de bien démarrer !
      Toutes les PRs sont les bienvenues sur '<a href="https://github.com/nullvoxpopuli/ember-cheat-sheet" target="_blank" rel="noopener noreferrer">le repository GitHub</a>'.
    description-2: >
      Pour des informations plus détaillées, consultez '<a href="https://guides.emberjs.com/release/" target="_blank" rel="noopener noreferrer">les guides Ember</a>'.

octane-v-classic: >
  Si vous cherchez l’aide-mémoire « Ember Octane vs. Ember Classic », il est '<a href="https://ember-learn.github.io/ember-octane-vs-classic-cheat-sheet/">ici</a>'.

