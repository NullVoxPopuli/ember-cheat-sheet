title: Kondiĉoj
description: >
  <code>if</code> bildigas sian blokon, kiam la valoro estas vereca (truthy).
  En ŝablonoj, malplena tabelo estas malvereca (falsy), kio malsamas ol en Javaskripto.
  <code>unless</code> estas la malo de <code>if</code>.

inline: >
  Enlinie, <code>if</code> redonas sian duan argumenton, kiam la kondiĉo estas vereca.
  Se ne, ĝi redonas sian trian argumenton.

operators: >
  Kombinu kondiĉojn per la komparaj helpantoj kaj la logikaj helpantoj.
  En etikedo <code>&lt;template&gt;</code>, ili estas parto de Ember 7.3 kaj ne bezonas importon.
