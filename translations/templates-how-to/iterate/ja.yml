title: 繰り返し
description: >
  <code>each</code>は、配列やそのほかのイテラブルの項目ごとに1回ずつブロックをレンダリングします。2番目のブロックパラメーターはインデックスです。<code>else</code>ブロックは、リストが空のときにレンダリングされます。

key: >
  デフォルトでは、Emberはオブジェクトの同一性でそれぞれの項目を識別します。同じ項目を表す新しいオブジェクトがリストに入る場合は、一意な値を持つプロパティの名前を<code>key</code>に指定します。そうすると、Emberはそれぞれの項目のDOMを保持します。

each-in: >
  <code>each-in</code>は、オブジェクトのキーごとに1回ずつブロックをレンダリングします。
