title: Definir variables
description: >
  Usar <code>let</code> es la única forma de definir variables en línea en las plantillas. Como <code>let</code> es un helper de bloque, su ámbito es coherente con el de los demás bloques de las plantillas. Esto es distinto de lenguajes como JavaScript, donde una variable definida queda accesible en el "ámbito actual" -- con <code>let</code>, creas un ámbito nuevo.

example: >
  En este ejemplo, se crea un array que luego está disponible dentro del bloque <code>let</code> como <code>list</code>. Se puede iterar sobre él igual que sobre cualquier array definido en JavaScript.

javascript: >
  En un archivo <code>.gjs</code> o <code>.gts</code>, una variable de JavaScript fuera del <code>&lt;template&gt;</code> suele ser más simple.
