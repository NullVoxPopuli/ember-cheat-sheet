title: Définir des Variables
description: >
  Utiliser <code>let</code> est la seule manière de définir des variables directement dans un modèle. Comme <code>let</code> est une aide de bloc (<i>block helper</i>), la portée se comporte comme celle des autres blocs des modèles. C’est différent de langages comme JavaScript, où une variable définie est accessible dans la « portée courante » : avec <code>let</code>, vous créez une nouvelle portée.

example: >
  Dans cet exemple, un tableau est créé puis rendu disponible dans le bloc <code>let</code> sous le nom <code>list</code>. Il peut être parcouru comme n’importe quel tableau défini en JavaScript.

javascript: >
  Dans un fichier <code>.gjs</code> ou <code>.gts</code>, une variable JavaScript déclarée en dehors du <code>&lt;template&gt;</code> est souvent plus simple.
