title: Değişken Tanımlama
description: >
  Şablonlarda satır içi değişken tanımlamanın tek yolu <code>let</code> kullanmaktır. <code>let</code> bir blok yardımcı fonksiyonu olduğu için kapsam, şablonlardaki diğer bloklarla da tutarlıdır. Bu, tanımlanan bir değişkene "geçerli kapsam" içinden erişilebilen JavaScript gibi dillerden farklıdır: <code>let</code> ile yeni bir kapsam oluşturursunuz.

example: >
  Bu örnekte bir dizi oluşturulur ve <code>let</code> bloğu içinde <code>list</code> adıyla kullanılabilir hale gelir. JavaScript'te tanımlanmış herhangi bir dizi gibi üzerinde yinelenebilir.

javascript: >
  Bir <code>.gjs</code> veya <code>.gts</code> dosyasında, <code>&lt;template&gt;</code> dışındaki bir JavaScript değişkeni çoğu zaman daha basittir.
