title: 変数を定義する
description: >
  テンプレートの中でインラインに変数を定義する方法は、<code>let</code>を使うことだけです。<code>let</code>はブロックヘルパーなので、スコープの扱いはテンプレートのほかのブロックと一貫しています。これは、定義した変数に「現在のスコープ」からアクセスできるJavaScriptなどの言語とは異なります。<code>let</code>では、新しいスコープを作ります。

example: >
  この例では、配列を作成し、<code>let</code>ブロックの中で<code>list</code>として使えるようにしています。JavaScriptで定義した配列と同じように反復処理できます。

javascript: >
  <code>.gjs</code>や<code>.gts</code>ファイルでは、<code>&lt;template&gt;</code>の外にJavaScriptの変数を書くほうが簡単なことがよくあります。
