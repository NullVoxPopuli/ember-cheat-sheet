title: Definindo Variáveis
description: >
  Usar <code>let</code> é a única forma de definir variáveis inline nos templates. Como <code>let</code> é um block helper, o escopo é consistente com o dos outros blocos nos templates. Isso é diferente de linguagens como JavaScript, em que uma variável definida fica acessível no "escopo atual" -- com <code>let</code>, você cria um novo escopo.

example: >
  Neste exemplo, um array é criado e fica disponível dentro do bloco <code>let</code> como <code>list</code>. Ele pode ser iterado como qualquer array definido em JavaScript.

javascript: >
  Em um arquivo <code>.gjs</code> ou <code>.gts</code>, uma variável JavaScript fora do <code>&lt;template&gt;</code> costuma ser mais simples.
