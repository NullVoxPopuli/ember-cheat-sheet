layout:
  application:
    title: Ember.jsチートシート
    shortTitle: チートシート
    logo-alt-text: 'Emberのロゴと、その横にある「Cheat Sheet」という文字（英語）'
    description-1: >
      このガイドは、'<a href="https://emberjs.com/" target="_blank" rel="noopener noreferrer">'Ember.js'</a>'を使うためのチートシートです。
      サンプルコードはEmber 7.3向けで、'<code>&lt;template&gt;</code>'タグを使っています。
      すべてを網羅しているわけではありませんが、始めるには十分です！
      プルリクエストを'<a href="https://github.com/nullvoxpopuli/ember-cheat-sheet" target="_blank" rel="noopener noreferrer">'GitHubリポジトリ'</a>'でお待ちしてます。
    description-2: >
      より詳細な情報は、'<a href="https://guides.emberjs.com/release/" target="_blank" rel="noopener noreferrer">'The Ember Guides'</a>'を参照してください。

octane-v-classic: >
  Ember OctaneとEmber Classicの比較用チートシートをお探しの場合は、'<a href="https://ember-learn.github.io/ember-octane-vs-classic-cheat-sheet/">'こちら'</a>'にあります。

