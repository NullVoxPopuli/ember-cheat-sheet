title: Built-in Helpers and Modifiers
description: >
  In Ember 7.3, these names work in every <code>&lt;template&gt;</code> tag without an import:
  <code>and</code>, <code>array</code>, <code>element</code>, <code>eq</code>, <code>fn</code>,
  <code>gt</code>, <code>gte</code>, <code>hash</code>, <code>lt</code>, <code>lte</code>,
  <code>neq</code>, <code>not</code>, <code>on</code>, and <code>or</code>.
  The same is true for the keywords of the template language, such as
  <code>if</code>, <code>each</code>, <code>let</code>, <code>yield</code>, and <code>component</code>.

imports: >
  Other helpers need an import in a <code>.gjs</code> or <code>.gts</code> file.
  In a <code>.hbs</code> template, Ember finds helpers by name.
  Of the names above, only <code>array</code>, <code>fn</code>, <code>hash</code>, and <code>on</code> are built in there.
  An addon must supply the others.
