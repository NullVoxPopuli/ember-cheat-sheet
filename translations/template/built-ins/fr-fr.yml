title: Les Aides et Modificateurs Intégrés
description: >
  Dans Ember 7.3, ces noms fonctionnent dans tous les modèles sans import :
  <code>and</code>, <code>array</code>, <code>element</code>, <code>eq</code>, <code>fn</code>,
  <code>gt</code>, <code>gte</code>, <code>hash</code>, <code>lt</code>, <code>lte</code>,
  <code>neq</code>, <code>not</code>, <code>on</code> et <code>or</code>.
  Il en va de même pour les mots-clés du langage de modèles, comme
  <code>if</code>, <code>each</code>, <code>let</code>, <code>yield</code> et <code>component</code>.

imports: >
  Les autres Aides (<i>Helpers</i>) doivent être importées dans un fichier <code>.gjs</code> ou <code>.gts</code>.
  Dans un modèle <code>.hbs</code>, Ember les trouve par leur nom.
