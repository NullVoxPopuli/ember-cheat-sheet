title: Notacio
description: >
  Male al Javaskripto, Ember-ŝablonoj uzas
  <a href="https://en.wikipedia.org/wiki/Polish_notation">
    Polan Notacion
  </a>
  aŭ <em>Prefiksan Notacion</em>, kio signifas, ke funkciigistoj (aŭ funkcioj)
  <em>antaŭas</em> siajn operantojn (argumentoj).
js-equiv: kiu estas la ekvivalento de ĉi tio, en Javaskripto

notes: >
  En Ember 7.3, <code>or</code>, <code>not</code>, kaj la aliaj logikaj kaj komparaj helpantoj estas parto de Ember.
  En pli malnovaj versioj de Ember, aldonaĵo kiel
  <a href="https://github.com/jmurphyau/ember-truth-helpers">ember-truth-helpers</a> provizas ilin.
