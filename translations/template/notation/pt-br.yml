title: Notação
description: >
  Diferentemente do JavaScript, os templates do Ember usam a
  <a href="https://en.wikipedia.org/wiki/Polish_notation">
    Notação Polonesa
  </a>
  ou <em>Notação Prefixada</em>, o que significa que os operadores (ou funções) <em>precedem</em> seus operandos (argumentos).

js-equiv: que é o equivalente a isto, em JavaScript

notes: >
  No Ember 7.3, <code>or</code>, <code>not</code> e os demais helpers lógicos e de comparação fazem parte do Ember.
  Em templates <code>.hbs</code> e em versões mais antigas do Ember, um addon como o
  <a href="https://github.com/jmurphyau/ember-truth-helpers">ember-truth-helpers</a> os fornece.
