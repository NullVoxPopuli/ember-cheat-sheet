title: Gösterim
description: >
  JavaScript'in aksine, Ember şablonları
  <a href="https://en.wikipedia.org/wiki/Polish_notation">
    Polish Notation
  </a>
  ya da diğer ismiyle <em>Prefix Notation</em> kullanır. Yani operatörler (ya da fonksiyonlar) operandların (argümanların) önünde yer alır.
js-equiv: Bu JavaScript'te şuna karşılık gelir.

notes: >
  Ember 7.3'te <code>or</code>, <code>not</code> ve diğer mantıksal ve karşılaştırma yardımcı fonksiyonları Ember'in bir parçasıdır.
  <code>.hbs</code> şablonlarında ve Ember'in eski sürümlerinde bunları
  <a href="https://github.com/jmurphyau/ember-truth-helpers">ember-truth-helpers</a> gibi bir eklenti sağlar.
