title: Gramática
description: >
  La gramática de las plantillas de Ember es un lenguaje intencionalmente simple, para que la GlimmerVM subyacente pueda ser rápida.
  Está construida sobre expresiones simbólicas
  (<a href="https://en.wikipedia.org/wiki/S-expression">S-Expressions</a>),
  una estructura en forma de árbol que ayuda a simplificar la sintaxis, la construcción y el análisis de las plantillas.
  <br>
  Si conoces TypeScript, podrías definir la gramática de las plantillas con un pseudocódigo como este,

plain-function: >
  Una función normal sirve como helper.
  No hace falta ningún addon ni ningún envoltorio, porque Ember llama a la función con los argumentos posicionales.
  Si hay argumentos con nombre, la función los recibe en un solo objeto como su último parámetro.

expression-breakdown: >
  En este ejemplo, <code>a</code> <em>solo</em> puede ser un helper.
  <code>b</code>, <code>c</code> y <code>e</code>
  no pueden ser otra cosa que valores simples, porque las funciones no se pueden
  invocar sin paréntesis alrededor.
