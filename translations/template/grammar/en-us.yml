title: Grammar
description: >
  Ember's template grammar is an intentionally simple language so that the underlying GlimmerVM can be fast.
  It is built on Symbolic Expressions
  (<a href="https://en.wikipedia.org/wiki/S-expression">S-Expressions</a>)
  which is a tree-based structure for helping simplify syntax, building, and parsing templates.
  <br>
  If you're familiar with TypeScript, you could define the template grammar using this pseudo-code here, like so,

plain-function: >
  A plain function works as a helper.
  No addon and no wrapper are necessary, because Ember calls the function with the positional arguments.
  If there are named arguments, the function receives them in one object as its last parameter.

expression-breakdown: >
  In this example, <code>a</code> can <em>only</em> be a helper. Each of
  <code>b</code>, <code>c</code>, and <code>e</code>
  cannot be anything other than plain values because functions cannot
  be invoked without surrounding parentheses.
