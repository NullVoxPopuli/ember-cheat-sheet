title: Gramática
description: >
  A gramática de templates do Ember é uma linguagem intencionalmente simples, para que a GlimmerVM subjacente possa ser rápida.
  Ela é construída sobre Expressões Simbólicas
  (<a href="https://en.wikipedia.org/wiki/S-expression">S-Expressions</a>),
  uma estrutura baseada em árvore que ajuda a simplificar a sintaxe, a construção e o parsing dos templates.
  <br>
  Se você conhece TypeScript, poderia definir a gramática de templates com este pseudocódigo, assim,

plain-function: >
  Uma função comum funciona como helper.
  Nenhum addon e nenhum wrapper são necessários, porque o Ember chama a função com os argumentos posicionais.
  Se houver argumentos nomeados, a função os recebe em um único objeto, como seu último parâmetro.

expression-breakdown: >
  Neste exemplo, <code>a</code> <em>só</em> pode ser um helper.
  <code>b</code>, <code>c</code> e <code>e</code>
  não podem ser nada além de valores simples, porque funções não podem
  ser invocadas sem parênteses em volta.
