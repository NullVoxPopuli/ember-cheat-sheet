title: 文法
description: >
  Emberのテンプレート文法は、基盤となるGlimmerVMが高速に動作できるよう、意図的にシンプルな言語になっています。この文法はシンボリック式（<a href="https://en.wikipedia.org/wiki/S-expression">S式</a>）に基づいています。S式は木構造で、テンプレートの構文、構築、解析を単純にするのに役立ちます。
  <br>
  TypeScriptに慣れているなら、テンプレートの文法は次のような疑似コードで定義できます。

plain-function: >
  普通の関数は、そのままヘルパーとして動作します。Emberが位置引数を渡して関数を呼び出すので、アドオンもラッパーも必要ありません。名前付き引数がある場合、関数はそれらを1つのオブジェクトにまとめて最後のパラメーターとして受け取ります。

expression-breakdown: >
  この例では、<code>a</code>はヘルパーで<em>しか</em>ありえません。<code>b</code>、<code>c</code>、<code>e</code>はいずれも、ただの値以外にはなりえません。関数は、丸括弧で囲まなければ呼び出せないためです。
