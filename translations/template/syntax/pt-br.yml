title: Sintaxe
description: >
  A sintaxe tem um papel importante no template porque, com base na posição de uma expressão no template, você sabe <em>exatamente</em> que tipo de coisa ela é: um modifier, um helper ou um valor simples

with-this: >
  Não importa como a referência ao modifier ou ao helper é escrita: é a <em>sintaxe</em> que determina o que é esperado.
