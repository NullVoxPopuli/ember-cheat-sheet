title: Sintaxis
description: >
  La sintaxis juega un papel importante en la plantilla, porque según la posición de una expresión en la plantilla sabrás <em>exactamente</em> qué tipo de cosa es: un modificador, un helper o un valor simple

with-this: >
  No importa cómo esté escrita la referencia al modificador o al helper; es la <em>sintaxis</em> la que determina qué se espera.
