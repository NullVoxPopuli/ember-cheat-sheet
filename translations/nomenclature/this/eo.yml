title: this
description: >
  <code>this</code> estas la instanco de la klaso, kiu enhavas la <code>&lt;template&gt;</code>.
  Nurŝablona komponanto ne havas klason, do tie <code>this</code> estas <code>undefined</code>.
  En itinera ŝablono en dosiero <code>.hbs</code>, <code>this</code> estas la instanco de la regilo.
