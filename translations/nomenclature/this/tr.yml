title: this
description: >
  <code>this</code>, <code>&lt;template&gt;</code> etiketini içeren sınıfın örneğidir.
  Sadece şablon olan bir bileşenin sınıfı yoktur, bu yüzden orada <code>this</code> değeri <code>undefined</code> olur.
  Bir <code>.hbs</code> dosyasındaki rota şablonunda <code>this</code>, denetçinin (controller) örneğidir.
