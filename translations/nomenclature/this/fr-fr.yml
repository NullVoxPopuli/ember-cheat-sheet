title: this
description: >
  <code>this</code> est l’instance de la classe qui contient le <code>&lt;template&gt;</code>.<br/>
  Un composant sans instance (<i>template-only component</i>) n’a pas de classe : <code>this</code> y vaut donc <code>undefined</code>.<br/>
  Dans un modèle de route écrit dans un fichier <code>.hbs</code>, <code>this</code> est l’instance du contrôleur (<i>controller</i>).
