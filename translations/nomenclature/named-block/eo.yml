title: Nomita Bloko
description: >
  Bloko kun nomo.
  La vokanto skribas nomitan blokon kiel <code>&lt;:name&gt;...&lt;/:name&gt;</code> ene de la komponanta alvoko.
  Komponanto povas ricevi multajn nomitajn blokojn, kaj ĝi decidas, kie ĉiu bloko bildiĝas.
  Bloko sen nomo estas la bloko kun la nomo <code>default</code>.
