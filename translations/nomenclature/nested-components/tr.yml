title: İç İçe Bileşenler
description: >
  Bileşenler klasörünün bir alt klasöründe bulunan bir bileşendir.
  Bir <code>.gjs</code> veya <code>.gts</code> dosyasında bileşeni yolundan import edin ve ona istediğiniz adı verin.

loose-mode: >
  Bir <code>.hbs</code> şablonunda Ember bileşenleri adlarıyla bulur.
  Orada, <code>app/components/nested/some-component</code> içindeki bir bileşen
  klasör adları arasına <code>::</code> konularak çağrılır.
