title: Blocos Nomeados
description: >
  Um componente com mais de um bloco permite que quem o chama preencha mais de um lugar.
  Renderize cada bloco com <code>yield</code> e <code>to="name"</code>.
  Use <code>has-block</code> para saber se quem chamou passou um bloco.

usage: Quem chama preenche cada bloco pelo nome.
