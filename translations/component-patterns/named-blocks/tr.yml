title: İsimlendirilmiş Bloklar
description: >
  Birden fazla bloğu olan bir bileşen, çağıranın birden fazla yeri doldurmasına olanak tanır.
  Her bloğu <code>yield</code> ve <code>to="name"</code> ile render edin.
  Çağıranın bir blok geçip geçmediğini öğrenmek için <code>has-block</code> kullanın.

usage: Çağıran her bloğu adıyla doldurur.
