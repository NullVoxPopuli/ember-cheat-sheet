title: Sağlayıcı Bileşenleri
description: >
  Sağlayıcı bileşen, durumun (state) ve davranışın sahibidir; kendisi hiçbir işaretleme (markup) render etmez.
  Durumu ve fonksiyonları yield eder, neyin render edileceğine ise çağıran karar verir.

usage: Çağıran, yield edilen değerleri blok parametreleri olarak alır.
